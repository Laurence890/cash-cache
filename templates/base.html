<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Ca$h Cache{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="site-nav">
        <div class="nav-brand">🐷 Ca$h Cache</div>

        <div class="nav-links">
            <a href="{{ url_for('home') }}" class="nav-button {% if request.endpoint == 'home' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('subscriptions') }}" class="nav-button {% if request.endpoint == 'subscriptions' %}active{% endif %}">Subscriptions</a>
            <a href="{{ url_for('budgeting') }}" class="nav-button {% if request.endpoint == 'budgeting' %}active{% endif %}">Budgeting</a>
            <a href="{{ url_for('reminders') }}" class="nav-button {% if request.endpoint == 'reminders' %}active{% endif %}">Calendar</a>
            <a href="{{ url_for('social') }}" class="nav-button {% if request.endpoint == 'social' %}active{% endif %}">Social</a>
            <a href="{{ url_for('logout') }}" class="nav-button">Log Out</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
